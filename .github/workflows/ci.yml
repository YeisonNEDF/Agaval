name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  launchers:
    name: Launchers and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX launcher
        run: |
          test -x start.sh
          sh -n start.sh
          ./start.sh --help
          ./start.sh --check --no-install
      - name: Validate PowerShell launcher
        shell: pwsh
        run: |
          ./start.ps1 -Help
          ./start.ps1 -Check -NoInstall
      - name: Resolve Compose configuration
        run: docker compose --env-file .env.example config --quiet

  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell diagnosis
        shell: powershell
        run: |
          .\start.ps1 -Help
          .\start.ps1 -Check -NoInstall
      - name: Validate CMD entry point
        shell: cmd
        run: start.cmd -Check -NoInstall

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Agaval.Inventory.slnx
      - run: dotnet tool restore
      - run: dotnet format Agaval.Inventory.slnx --verify-no-changes --no-restore
      - run: dotnet build Agaval.Inventory.slnx --configuration Release --no-restore
      - run: dotnet test Agaval.Inventory.slnx --configuration Release --no-build
      - run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Agaval.Inventory.Infrastructure
          --startup-project src/Agaval.Inventory.Api
          --configuration Release
          --no-build
      - run: dotnet list Agaval.Inventory.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [launchers, windows-launcher, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: agaval-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: agaval-frontend:ci
