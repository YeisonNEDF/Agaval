services:
  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    platform: ${SQLSERVER_PLATFORM:-linux/amd64}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Agaval_local_2026!}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  agaval-backend:
    build:
      context: ./backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Database: Server=sqlserver,1433;Database=${DATABASE_NAME:-GestorInventarioDB};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Agaval_local_2026!};Encrypt=True;TrustServerCertificate=True
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-true}
      Cors__AllowedOrigins__0: http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-4200}
    ports:
      - "${BACKEND_PORT:-5100}:8080"
    restart: unless-stopped

  agaval-frontend:
    build:
      context: ./frontend
    depends_on:
      - agaval-backend
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    restart: unless-stopped

volumes:
  sqlserver-data:
