<section class="category-list" aria-labelledby="category-list-title">
  <header>
    <div>
      <h2 id="category-list-title">Catálogo de categorías</h2>
      <p>{{ categories().length }} clasificaciones registradas</p>
    </div>
  </header>

  <div class="category-list__scroll">
    <table mat-table [dataSource]="categories()">
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let category">
          <div class="category-list__name">
            <span aria-hidden="true"><mat-icon>category</mat-icon></span>
            <div>
              <strong>{{ category.name }}</strong>
              <small>Identificador #{{ category.id }}</small>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let category" data-label="Estado">
          <span
            class="category-list__status"
            [class.category-list__status--inactive]="!category.isActive"
          >
            <span aria-hidden="true"></span>
            {{ category.isActive ? 'Activa' : 'Inactiva' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef><span class="category-list__sr-only">Acciones</span></th>
        <td mat-cell *matCellDef="let category">
          <div class="category-list__actions">
            <button
              mat-icon-button
              type="button"
              matTooltip="Editar categoría"
              [disabled]="saving()"
              (click)="editRequested.emit(category)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              class="category-list__delete"
              matTooltip="Desactivar categoría"
              [disabled]="saving() || !category.isActive"
              (click)="deactivateRequested.emit(category)"
            >
              <mat-icon>block</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</section>
