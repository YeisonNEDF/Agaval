apiVersion: apps/v1
kind: Deployment
metadata:
  name: agaval-backend
  labels:
    app.kubernetes.io/name: agaval-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agaval-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agaval-backend
    spec:
      containers:
        - name: api
          image: ghcr.io/organization/agaval-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agaval-backend
          env:
            - name: ConnectionStrings__Database
              valueFrom:
                secretKeyRef:
                  name: agaval-secrets
                  key: database-connection
            - name: Authentication__SigningKey
              valueFrom:
                secretKeyRef:
                  name: agaval-secrets
                  key: jwt-signing-key
            - name: Authentication__Username
              valueFrom:
                secretKeyRef:
                  name: agaval-secrets
                  key: auth-username
            - name: Authentication__Password
              valueFrom:
                secretKeyRef:
                  name: agaval-secrets
                  key: auth-password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agaval-backend
spec:
  selector:
    app.kubernetes.io/name: agaval-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
