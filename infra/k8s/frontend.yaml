apiVersion: apps/v1
kind: Deployment
metadata:
  name: agaval-frontend
  labels:
    app.kubernetes.io/name: agaval-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agaval-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agaval-frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/organization/agaval-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_UPSTREAM
              value: http://agaval-backend:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agaval-frontend
spec:
  selector:
    app.kubernetes.io/name: agaval-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
